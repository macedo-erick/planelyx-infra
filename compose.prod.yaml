name: planelyx

networks:
  planelyx:
    ipam:
      config:
        - subnet: 172.20.0.0/16

services:
  ui:
    image: ${REGISTRY:?REGISTRY is not set}/ui:${UI_TAG:?UI_TAG is not set}
    restart: unless-stopped
    ports: ['127.0.0.1:8081:8080']
    networks: [planelyx]
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    image: ${REGISTRY:?REGISTRY is not set}/api:${API_TAG:?API_TAG is not set}
    restart: unless-stopped
    ports: ['127.0.0.1:8082:8080']
    networks: [planelyx]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
      - 'planelyx.com:host-gateway'
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: '5432'
      POSTGRES_DB: planelyx
      POSTGRES_USER: planelyx_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      KEYCLOAK_ISSUER_URI: https://planelyx.com/auth/realms/planelyx
      KEYCLOAK_SERVER_URL: http://auth:8080/auth
      KEYCLOAK_REALM: planelyx
      KEYCLOAK_ADMIN_CLIENT_ID: planelyx-api-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is not set}
      PLANELYX_PROVISIONING_SECRET: ${PLANELYX_PROVISIONING_SECRET:?PLANELYX_PROVISIONING_SECRET is not set}
      PLANELYX_CORS_ORIGINS: https://planelyx.com
    depends_on:
      auth:
        condition: service_healthy
    logging: *logging

  auth:
    image: ${REGISTRY:?REGISTRY is not set}/auth:${AUTH_TAG:?AUTH_TAG is not set}
    restart: unless-stopped
    ports: ['127.0.0.1:8083:8080']
    networks: [planelyx]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HOSTNAME: https://planelyx.com/auth
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      PLANELYX_UI_ORIGIN: https://planelyx.com
      PLANELYX_UI_BASE_URL: https://planelyx.com/ui
      PLANELYX_KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is not set}
      PLANELYX_PROVISIONING_URL: http://api:8080/internal/keycloak/user-registered
      PLANELYX_PROVISIONING_SECRET: ${PLANELYX_PROVISIONING_SECRET:?PLANELYX_PROVISIONING_SECRET is not set}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *logging

  ocr:
    image: ${REGISTRY:?REGISTRY is not set}/ocr:${OCR_TAG:?OCR_TAG is not set}
    restart: unless-stopped
    ports: ['127.0.0.1:8084:8080']
    networks: [planelyx]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: '5432'
      POSTGRES_DB: planelyx_ocr
      POSTGRES_USER: planelyx_ocr
      POSTGRES_PASSWORD: ${OCR_DB_PASSWORD:?OCR_DB_PASSWORD is not set}
      HTTP_HOST: 0.0.0.0
      KEYCLOAK_ISSUER_URI: https://planelyx.com/auth/realms/planelyx
      KEYCLOAK_JWKS_URI: http://auth:8080/auth/realms/planelyx/protocol/openid-connect/certs
      PLANELYX_API_URL: http://api:8080/api
      OCR_DATA_DIR: /app/data
      OCR_MASTER_KEY_FILE: /app/keys/master.key
      OCR_LLM_ENABLED: 'false'
    volumes:
      - ocr-data:/app/data
      - ocr-keys:/app/keys
    logging: *logging

volumes:
  ocr-data:
  ocr-keys:
