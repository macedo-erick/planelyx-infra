# Production stack for planelyx.com.
#
# nginx and Postgres live on the VPS host, not here. Every service binds to 127.0.0.1 so
# the only way in from the internet is through the host nginx on 443.
name: planelyx

networks:
  planelyx:
    ipam:
      config:
        # Fixed so pg_hba.conf can name it precisely instead of trusting a broad
        # 172.16.0.0/12. Keep these two in step.
        - subnet: 172.20.0.0/16

services:
  ui:
    image: ${REGISTRY}/ui:${UI_TAG}
    restart: unless-stopped
    ports: ['127.0.0.1:8081:8080']
    networks: [planelyx]
    logging: &logging
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  api:
    image: ${REGISTRY}/api:${API_TAG}
    restart: unless-stopped
    ports: ['127.0.0.1:8082:8080']
    networks: [planelyx]
    extra_hosts:
      # Host Postgres.
      - 'host.docker.internal:host-gateway'
      # The API validates JWTs by issuer, so it must fetch JWKS from the *public* issuer
      # URL — that is the string inside the token's `iss` claim. Mapping the domain to the
      # bridge gateway sends it straight to the host nginx instead of hairpinning out to
      # the public IP and back. TLS still validates: the SNI hostname is genuine.
      - 'planelyx.com:host-gateway'
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: '5432'
      POSTGRES_DB: planelyx
      POSTGRES_USER: planelyx_app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      # Must match the realm's issuer byte for byte, including the /auth prefix.
      KEYCLOAK_ISSUER_URI: https://planelyx.com/auth/realms/planelyx
      # Same-origin in production so CORS never fires, but a correct value costs nothing.
      PLANELYX_CORS_ORIGINS: https://planelyx.com
    # Healthcheck is defined in the API image itself (curl /actuator/health).
    depends_on:
      auth:
        condition: service_healthy
    logging: *logging

  auth:
    image: ${REGISTRY}/auth:${AUTH_TAG}
    restart: unless-stopped
    ports: ['127.0.0.1:8083:8080']
    networks: [planelyx]
    extra_hosts: ['host.docker.internal:host-gateway']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      # Full public URL including the path. This is what makes tokens carry
      # iss=https://planelyx.com/auth/realms/planelyx.
      KC_HOSTNAME: https://planelyx.com/auth
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      # KC_DB, KC_HEALTH_ENABLED, KC_HTTP_RELATIVE_PATH and
      # KC_HTTP_MANAGEMENT_RELATIVE_PATH are build-time options baked into the image by
      # planelyx-auth/Dockerfile. `start --optimized` exits 2 if a runtime value differs
      # from the baked one, so change them there and rebuild — never override them here.
      # Renamed from KEYCLOAK_ADMIN in Keycloak 26. First boot only.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      # Realm-import substitutions; resolved only on the very first boot.
      PLANELYX_UI_ORIGIN: https://planelyx.com
      PLANELYX_UI_BASE_URL: https://planelyx.com/ui
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q "200 OK" <&3',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    logging: *logging
