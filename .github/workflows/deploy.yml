name: deploy

on:
  workflow_dispatch:
    inputs:
      api_tag:
        description: 'API image tag (commit SHA) — leave blank to leave the API untouched'
        type: string
        default: ''
      ui_tag:
        description: 'UI image tag (commit SHA) — leave blank to leave the UI untouched'
        type: string
        default: ''
      ocr_tag:
        description: 'OCR image tag (commit SHA) — leave blank to leave the OCR service untouched'
        type: string
        default: ''
      allow_secret_change:
        description: 'Allow DB credentials to differ from the VPS (credential rotation)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGION: southamerica-east1
  REPOSITORY: planelyx
  VPS_PATH: planelyx-infra
  PUBLIC_URL: https://planelyx.com
  NEIGHBOUR_URL: https://monitoring.macedosoftware.com/login
  WAIT_TIMEOUT: '300'
  # Installed by this repo. snippets/keycloak-proxy.conf is deliberately absent: the auth
  # repo owns that file, and planelyx.conf includes it. Never delete what is not listed here.
  NGINX_PAYLOAD: nginx/planelyx.conf nginx/snippets/planelyx-proxy.conf

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Validate inputs
        id: validate
        env:
          API_TAG: ${{ inputs.api_tag }}
          UI_TAG: ${{ inputs.ui_tag }}
          OCR_TAG: ${{ inputs.ocr_tag }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          OCR_DB_PASSWORD: ${{ secrets.OCR_DB_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          PLANELYX_PROVISIONING_SECRET: ${{ secrets.PLANELYX_PROVISIONING_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OCR_LLM_ENABLED: ${{ vars.OCR_LLM_ENABLED }}
          API_LOG_LEVEL: ${{ vars.API_LOG_LEVEL }}
          API_LOG_LEVEL_ROOT: ${{ vars.API_LOG_LEVEL_ROOT }}
          OCR_LOG_LEVEL: ${{ vars.OCR_LOG_LEVEL }}
        run: |
          set -euo pipefail
          fail=0
          services=()

          for svc in api ui ocr; do
              upper=${svc^^}
              tag_var="${upper}_TAG"
              tag=${!tag_var}

              [[ -n $tag ]] || continue

              if [[ ! $tag =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
                  echo "::error::'$svc' tag is not a valid image tag. Allowed: letters, digits, dot, underscore, hyphen (max 128)."
                  fail=1
              else
                  services+=("$svc")
              fi
          done

          if (( fail == 0 )) && (( ${#services[@]} == 0 )); then
              echo "::error::No service selected. Give the commit SHA of at least one service (the service repo's release run prints it as 'API_TAG=...', 'UI_TAG=...' or 'OCR_TAG=...')."
              fail=1
          fi

          for name in GCP_PROJECT_ID APP_DB_PASSWORD OCR_DB_PASSWORD KEYCLOAK_ADMIN_CLIENT_SECRET PLANELYX_PROVISIONING_SECRET; do
              value=${!name}
              if [[ -z $value ]]; then
                  echo "::error::Repo secret $name is empty or not set."
                  fail=1
              elif [[ $value == *"'"* ]]; then
                  echo "::error::Repo secret $name contains a single quote, which cannot be represented in a Compose .env value. Regenerate it without one."
                  fail=1
              fi
          done

          if [[ -n ${ANTHROPIC_API_KEY:-} && ${ANTHROPIC_API_KEY:-} == *"'"* ]]; then
              echo "::error::Repo secret ANTHROPIC_API_KEY contains a single quote, which cannot be represented in a Compose .env value."
              fail=1
          fi

          # A bad level is not caught by anything downstream: pino throws on an unknown
          # one and the container restart-loops, and only `ui` has a restart check.
          for name in API_LOG_LEVEL API_LOG_LEVEL_ROOT; do
              value=${!name}
              [[ -z $value ]] && continue
              if [[ ! ${value^^} =~ ^(TRACE|DEBUG|INFO|WARN|ERROR|FATAL|OFF)$ ]]; then
                  echo "::error::Repo variable $name is '$value'. Expected one of TRACE DEBUG INFO WARN ERROR FATAL OFF."
                  fail=1
              fi
          done

          # Lowercase only — pino is case-sensitive and does not coerce.
          if [[ -n ${OCR_LOG_LEVEL:-} && ! $OCR_LOG_LEVEL =~ ^(trace|debug|info|warn|error|fatal|silent)$ ]]; then
              echo "::error::Repo variable OCR_LOG_LEVEL is '$OCR_LOG_LEVEL'. Expected one of trace debug info warn error fatal silent, lowercase."
              fail=1
          fi

          if [[ ${OCR_LLM_ENABLED:-false} == true && -z ${ANTHROPIC_API_KEY:-} ]]; then
              echo "::error::Repo variable OCR_LLM_ENABLED is true but the ANTHROPIC_API_KEY secret is empty. The ocr service refuses to start in that state (src/config.ts), so it would restart-loop on the VPS. Set the key, or set OCR_LLM_ENABLED to false to keep every document on the machine."
              fail=1
          fi

          (( fail == 0 )) || exit 1

          echo "services=${services[*]}" >> "$GITHUB_OUTPUT"
          echo "Selected: ${services[*]}"

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/deploy_known_hosts

          {
              echo "SSH_OPTS=-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/deploy_known_hosts -i $HOME/.ssh/deploy_key"
              echo "REMOTE=$VPS_USER@$VPS_HOST"
          } >> "$GITHUB_ENV"

      - name: Ship compose.prod.yaml and the nginx config
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$REMOTE" "mkdir -p '$VPS_PATH'"
          ssh $SSH_OPTS "$REMOTE" "cat > '$VPS_PATH/compose.prod.yaml.staged'" < compose.prod.yaml

          ssh $SSH_OPTS "$REMOTE" "rm -rf '$VPS_PATH/.nginx-staged' && mkdir -p '$VPS_PATH/.nginx-staged'"
          tar -cz $NGINX_PAYLOAD | ssh $SSH_OPTS "$REMOTE" "tar -xz -C '$VPS_PATH/.nginx-staged'"

          echo "Shipped compose.prod.yaml and the nginx config from ${GITHUB_SHA:0:7}"

      - name: Read current tags from the VPS
        id: current
        env:
          SELECTED: ${{ steps.validate.outputs.services }}
          IN_API_TAG: ${{ inputs.api_tag }}
          IN_UI_TAG: ${{ inputs.ui_tag }}
          IN_OCR_TAG: ${{ inputs.ocr_tag }}
        run: |
          set -euo pipefail

          read_env_key() {
              ssh $SSH_OPTS "$REMOTE" "bash -s -- '$VPS_PATH' '$1'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          [[ -f .env ]] || exit 0
          sed -n "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*//p" .env \
              | tail -n1 \
              | tr -d '\r' \
              | sed -e 's/[[:space:]]*$//' -e "s/^'\(.*\)'\$/\1/" -e "s/^\"\(.*\)\"\$/\1/"
          REMOTE_SCRIPT
          }

          env_exists=$(ssh $SSH_OPTS "$REMOTE" "test -f '$VPS_PATH/.env' && echo yes || echo no")
          echo "env_exists=$env_exists" >> "$GITHUB_OUTPUT"

          fail=0
          carried=()

          for svc in api ui ocr; do
              upper=${svc^^}
              input_var="IN_${upper}_TAG"

              if [[ " $SELECTED " == *" $svc "* ]]; then
                  resolved=${!input_var}
              elif [[ $env_exists == no ]]; then
                  echo "::error::First deploy: no .env exists on the VPS yet, so all three tags must be supplied. '$svc' was left blank."
                  fail=1
                  continue
              else
                  resolved=$(read_env_key "${upper}_TAG")
                  if [[ ! $resolved =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
                      echo "::error::Cannot carry forward ${upper}_TAG: the value in the VPS .env is missing or malformed. Fix it on the box, or supply a tag for '$svc' explicitly."
                      fail=1
                      continue
                  fi
                  carried+=("$svc=$resolved")
              fi

              echo "${svc}_tag=$resolved" >> "$GITHUB_OUTPUT"
          done

          (( fail == 0 )) || exit 1

          echo "carried=${carried[*]}" >> "$GITHUB_OUTPUT"

      - name: Check for credential drift
        if: ${{ steps.current.outputs.env_exists == 'yes' && !inputs.allow_secret_change }}
        env:
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          OCR_DB_PASSWORD: ${{ secrets.OCR_DB_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          PLANELYX_PROVISIONING_SECRET: ${{ secrets.PLANELYX_PROVISIONING_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          read_env_key() {
              ssh $SSH_OPTS "$REMOTE" "bash -s -- '$VPS_PATH' '$1'" <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          [[ -f .env ]] || exit 0
          sed -n "s/^[[:space:]]*$2[[:space:]]*=[[:space:]]*//p" .env \
              | tail -n1 \
              | tr -d '\r' \
              | sed -e 's/[[:space:]]*$//' -e "s/^'\(.*\)'\$/\1/" -e "s/^\"\(.*\)\"\$/\1/"
          REMOTE_SCRIPT
          }

          fail=0

          for name in APP_DB_PASSWORD OCR_DB_PASSWORD KEYCLOAK_ADMIN_CLIENT_SECRET PLANELYX_PROVISIONING_SECRET ANTHROPIC_API_KEY; do
              on_vps=$(read_env_key "$name")
              if [[ $on_vps != "${!name}" ]]; then
                  echo "::error::Secret drift: $name differs between the repo secret and the VPS .env. If this is a deliberate rotation, re-run with 'Allow DB credentials to differ' ticked — and make sure the Postgres role, or the auth repo's copy of a shared secret, was changed to match."
                  fail=1
              fi
          done

          (( fail == 0 )) || exit 1
          echo "No drift: the five credentials match what the VPS is already using."

      - name: Stage the rendered .env
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          OCR_DB_PASSWORD: ${{ secrets.OCR_DB_PASSWORD }}
          KEYCLOAK_ADMIN_CLIENT_SECRET: ${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}
          PLANELYX_PROVISIONING_SECRET: ${{ secrets.PLANELYX_PROVISIONING_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OCR_LLM_ENABLED: ${{ vars.OCR_LLM_ENABLED }}
          OCR_LLM_PARSE_MODE: ${{ vars.OCR_LLM_PARSE_MODE }}
          OCR_LLM_MONTHLY_CEILING_USD: ${{ vars.OCR_LLM_MONTHLY_CEILING_USD }}
          API_LOG_LEVEL: ${{ vars.API_LOG_LEVEL }}
          API_LOG_LEVEL_ROOT: ${{ vars.API_LOG_LEVEL_ROOT }}
          OCR_LOG_LEVEL: ${{ vars.OCR_LOG_LEVEL }}
          API_TAG: ${{ steps.current.outputs.api_tag }}
          UI_TAG: ${{ steps.current.outputs.ui_tag }}
          OCR_TAG: ${{ steps.current.outputs.ocr_tag }}
        run: |
          set -euo pipefail
          umask 077

          rendered=$(
              printf '# Rendered by .github/workflows/deploy.yml (run %s). Hand edits are lost on the next deploy.\n' "$GITHUB_RUN_ID"
              printf 'REGISTRY=%s-docker.pkg.dev/%s/%s\n' "$REGION" "$GCP_PROJECT_ID" "$REPOSITORY"
              printf 'API_TAG=%s\n' "$API_TAG"
              printf 'UI_TAG=%s\n' "$UI_TAG"
              printf 'OCR_TAG=%s\n' "$OCR_TAG"
              printf "APP_DB_PASSWORD='%s'\n" "$APP_DB_PASSWORD"
              printf "OCR_DB_PASSWORD='%s'\n" "$OCR_DB_PASSWORD"
              printf "KEYCLOAK_ADMIN_CLIENT_SECRET='%s'\n" "$KEYCLOAK_ADMIN_CLIENT_SECRET"
              printf "PLANELYX_PROVISIONING_SECRET='%s'\n" "$PLANELYX_PROVISIONING_SECRET"
              printf 'OCR_LLM_ENABLED=%s\n' "${OCR_LLM_ENABLED:-false}"
              printf 'OCR_LLM_PARSE_MODE=%s\n' "${OCR_LLM_PARSE_MODE:-fallback}"
              printf 'OCR_LLM_MONTHLY_CEILING_USD=%s\n' "${OCR_LLM_MONTHLY_CEILING_USD:-10}"
              printf "ANTHROPIC_API_KEY='%s'\n" "${ANTHROPIC_API_KEY:-}"
              printf 'API_LOG_LEVEL=%s\n' "${API_LOG_LEVEL:-INFO}"
              printf 'API_LOG_LEVEL_ROOT=%s\n' "${API_LOG_LEVEL_ROOT:-INFO}"
              printf 'OCR_LOG_LEVEL=%s\n' "${OCR_LOG_LEVEL:-info}"
          )

          printf '%s\n' "$rendered" \
              | ssh $SSH_OPTS "$REMOTE" "umask 077 && cat > '$VPS_PATH/.env.staged'"

          echo "Staged .env on the VPS (contents deliberately not logged)."

      - name: Pull images against the staged files
        env:
          SELECTED: ${{ steps.validate.outputs.services }}
        run: |
          set -euo pipefail
          ssh $SSH_OPTS "$REMOTE" \
              "cd '$VPS_PATH' && docker compose -f compose.prod.yaml.staged --env-file .env.staged pull $SELECTED"

      - name: Deploy
        env:
          SELECTED: ${{ steps.validate.outputs.services }}
        run: |
          set -euo pipefail

          log="${RUNNER_TEMP:-/tmp}/deploy-remote.log"

          ssh $SSH_OPTS "$REMOTE" bash -s -- "$VPS_PATH" "$WAIT_TIMEOUT" $SELECTED <<'REMOTE_SCRIPT' | tee "$log"
          set -euo pipefail
          cd "$1"
          wait_timeout=$2
          shift 2
          services=("$@")
          COMPOSE=compose.prod.yaml

          if (( ${#services[@]} == 0 )); then
              echo "error: no services passed to the deploy script" >&2
              exit 2
          fi

          cp .env .env.prev 2>/dev/null || true
          mv .env.staged .env
          mv compose.prod.yaml.staged "$COMPOSE"

          dump_logs() {
              echo >&2
              echo "--- last 50 log lines per deployed service ---" >&2
              docker compose -f "$COMPOSE" logs --tail 50 "${services[@]}" >&2 || true
          }

          if [[ " ${services[*]} " == *" ocr "* ]]; then
              echo "Applying planelyx-ocr migrations..."
              docker compose -f "$COMPOSE" run --rm -T ocr node dist/storage/migrate.js < /dev/null \
                  || { echo "error: planelyx-ocr migrations failed; the stack was not touched" >&2; exit 1; }
          fi

          if (( ${#services[@]} == 3 )); then
              docker compose -f "$COMPOSE" up -d --wait --wait-timeout "$wait_timeout" --remove-orphans \
                  || { dump_logs; exit 1; }
          else
              docker compose -f "$COMPOSE" up -d --wait --wait-timeout "$wait_timeout" --no-deps "${services[@]}" \
                  || { dump_logs; exit 1; }
          fi

          docker image prune -f || true

          echo
          docker compose -f "$COMPOSE" ps

          echo DEPLOY_SCRIPT_COMPLETE
          REMOTE_SCRIPT

          grep -qx DEPLOY_SCRIPT_COMPLETE "$log" || {
              echo "::error::The remote deploy script did not run to completion — its closing sentinel never arrived. Everything after the cut was skipped, which very likely includes 'up', so the stack may be untouched or half-updated. Check whether a command in the script consumed stdin before re-running."
              exit 1
          }

      - name: Install the nginx config
        run: |
          set -euo pipefail

          ssh $SSH_OPTS "$REMOTE" bash -s -- "$VPS_PATH" $NGINX_PAYLOAD <<'REMOTE_SCRIPT'
          set -euo pipefail
          cd "$1"
          shift
          payload=("$@")

          # Repo path -> live path. The vhost has no .conf suffix on the box; the snippet does.
          live_path_for() {
              case "$1" in
                  nginx/planelyx.conf)                 echo /etc/nginx/sites-available/planelyx ;;
                  nginx/snippets/planelyx-proxy.conf)  echo /etc/nginx/snippets/planelyx-proxy.conf ;;
                  *) echo "error: no live path mapped for '$1'" >&2; return 1 ;;
              esac
          }

          mkdir -p nginx-prev
          changed=()

          for item in "${payload[@]}"; do
              new=".nginx-staged/$item"
              live=$(live_path_for "$item")

              if [[ ! -e $live ]]; then
                  echo "error: $live does not exist. Run the bootstrap in VPS_SETUP.md §9 first." >&2
                  exit 1
              fi
              if [[ ! -w $live ]]; then
                  echo "error: $live is not writable by this user. See VPS_SETUP.md §9." >&2
                  exit 1
              fi

              cmp -s "$new" "$live" || changed+=("$item")
          done

          if (( ${#changed[@]} == 0 )); then
              echo "nginx: config unchanged, not reloading"
              exit 0
          fi

          printf 'nginx: changed -> %s\n' "${changed[@]}"

          restore() {
              for item in "${changed[@]}"; do
                  cp "nginx-prev/$(basename "$item")" "$(live_path_for "$item")"
              done
          }

          for item in "${changed[@]}"; do
              live=$(live_path_for "$item")
              cp "$live" "nginx-prev/$(basename "$item")"
              cp ".nginx-staged/$item" "$live"
          done

          # Validate before reloading: this nginx also serves monitoring.macedosoftware.com,
          # so a bad config here must never reach the running process.
          if ! sudo nginx -t; then
              restore
              echo "error: nginx -t failed; previous config restored, nginx not reloaded" >&2
              exit 1
          fi

          sudo systemctl reload nginx
          echo "nginx: config updated and reloaded"
          REMOTE_SCRIPT

      - name: Smoke checks
        env:
          SELECTED: ${{ steps.validate.outputs.services }}
        run: |
          set -euo pipefail
          fail=0
          remote_compose="cd '$VPS_PATH' && docker compose -f compose.prod.yaml"

          if [[ " $SELECTED " == *" ui "* ]]; then
              cid=$(ssh $SSH_OPTS "$REMOTE" "$remote_compose ps -q ui | tail -n1") || cid=""
              if [[ -z $cid ]]; then
                  echo "::error::ui has no container after up."
                  fail=1
              else
                  before=$(ssh $SSH_OPTS "$REMOTE" "docker inspect --format '{{.RestartCount}}' $cid")
                  sleep 15
                  after=$(ssh $SSH_OPTS "$REMOTE" "docker inspect --format '{{.RestartCount}}' $cid")
                  state=$(ssh $SSH_OPTS "$REMOTE" "docker inspect --format '{{.State.Status}}' $cid")

                  if [[ $state == running && $after == "$before" ]]; then
                      echo "ui: stable (no restarts during dwell)"
                  else
                      echo "::error::ui is not stable (state: ${state:-unknown}, restarts: ${before:-?} -> ${after:-?})."
                      fail=1
                  fi
              fi

              if curl -fsS --retry 5 --retry-delay 3 -o /dev/null "$PUBLIC_URL/ui/"; then
                  echo "ui: $PUBLIC_URL/ui/ serves 200"
              else
                  echo "::error::ui: $PUBLIC_URL/ui/ did not return 200."
                  fail=1
              fi
          fi

          if [[ " $SELECTED " == *" api "* ]]; then
              health=$(ssh $SSH_OPTS "$REMOTE" \
                  "curl -fsS --retry 5 --retry-delay 3 http://127.0.0.1:8082/actuator/health") || health=""
              if [[ $health == *'"status":"UP"'* ]]; then
                  echo "api: /actuator/health is UP"
              else
                  echo "::error::api: /actuator/health returned '${health:-unreachable}'."
                  fail=1
              fi

              code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 \
                  "$PUBLIC_URL/api/bank-accounts") || code="000"
              if [[ $code == 401 ]]; then
                  echo "api: $PUBLIC_URL/api/bank-accounts rejects anonymous callers with 401"
              else
                  echo "::error::api: $PUBLIC_URL/api/bank-accounts returned $code, expected 401."
                  fail=1
              fi
          fi

          if [[ " $SELECTED " == *" ocr "* ]]; then
              health=$(ssh $SSH_OPTS "$REMOTE" \
                  "curl -fsS --retry 5 --retry-delay 3 http://127.0.0.1:8084/ocr/healthz") || health=""
              if [[ $health == *'"status":"ok"'* ]]; then
                  echo "ocr: /ocr/healthz is ok (database reachable)"
              else
                  echo "::error::ocr: /ocr/healthz returned '${health:-unreachable}'."
                  fail=1
              fi

              code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 \
                  "$PUBLIC_URL/ocr/documents") || code="000"
              if [[ $code == 401 ]]; then
                  echo "ocr: $PUBLIC_URL/ocr/documents rejects anonymous callers with 401"
              else
                  echo "::error::ocr: $PUBLIC_URL/ocr/documents returned $code, expected 401."
                  fail=1
              fi
          fi

          # The nginx reload touched a process shared with the monitoring stack.
          if curl -fsS --retry 5 --retry-delay 3 -o /dev/null "$NEIGHBOUR_URL"; then
              echo "neighbour: $NEIGHBOUR_URL still serves"
          else
              echo "::error::neighbour: $NEIGHBOUR_URL broke after the nginx reload."
              fail=1
          fi

          (( fail == 0 )) || exit 1

      - name: Dump logs on failure
        if: ${{ failure() && steps.validate.outputs.services != '' }}
        env:
          SELECTED: ${{ steps.validate.outputs.services }}
        run: |
          if [[ -n ${REMOTE:-} ]]; then
              ssh $SSH_OPTS "$REMOTE" \
                  "cd '$VPS_PATH' && docker compose -f compose.prod.yaml logs --tail 50 $SELECTED" || true
          fi

      - name: Summary
        if: ${{ always() && steps.validate.outputs.services != '' }}
        env:
          SELECTED: ${{ steps.validate.outputs.services }}
          CARRIED: ${{ steps.current.outputs.carried }}
          API_TAG: ${{ steps.current.outputs.api_tag }}
          UI_TAG: ${{ steps.current.outputs.ui_tag }}
          OCR_TAG: ${{ steps.current.outputs.ocr_tag }}
        run: |
          set -euo pipefail
          {
              echo "## Deploy — ${{ job.status }}"
              echo
              echo "| Service | Tag | |"
              echo "|---|---|---|"
              for svc in api ui ocr; do
                  upper=${svc^^}
                  tag_var="${upper}_TAG"
                  tag=${!tag_var:-—}
                  if [[ " $SELECTED " == *" $svc "* ]]; then
                      echo "| \`$svc\` | \`$tag\` | **deployed** |"
                  else
                      echo "| \`$svc\` | \`$tag\` | untouched |"
                  fi
              done
              echo
              echo "Compose file shipped from \`${GITHUB_SHA:0:7}\`."
              echo
              echo "Rollback: re-run this workflow with the tags from the previous run, or read \`.env.prev\` on the VPS."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up
        if: always()
        run: |
          if [[ -n ${REMOTE:-} ]]; then
              ssh $SSH_OPTS "$REMOTE" "rm -rf '$VPS_PATH/.env.staged' '$VPS_PATH/compose.prod.yaml.staged' '$VPS_PATH/.nginx-staged'" || true
          fi
          rm -f ~/.ssh/deploy_key ~/.ssh/deploy_known_hosts
