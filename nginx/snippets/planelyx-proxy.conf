# Shared proxy headers. Install to /etc/nginx/snippets/planelyx-proxy.conf.
#
# Spring Boot reads these via server.forward-headers-strategy=framework and Keycloak via
# KC_PROXY_HEADERS=xforwarded. Without them both services would believe they are serving
# plain HTTP on 127.0.0.1 and would emit broken absolute URLs.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  443;
