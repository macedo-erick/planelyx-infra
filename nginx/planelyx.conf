server {
    listen 80;
    listen [::]:80;
    server_name planelyx.com www.planelyx.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://planelyx.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.planelyx.com;

    ssl_certificate     /etc/letsencrypt/live/planelyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planelyx.com/privkey.pem;

    return 301 https://planelyx.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name planelyx.com;

    ssl_certificate     /etc/letsencrypt/live/planelyx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planelyx.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location = / {
        return 302 /ui/;
    }

    location /ui/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/planelyx-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/planelyx-proxy.conf;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8085;
        include /etc/nginx/snippets/keycloak-proxy.conf;
    }

    location /auth/admin/ {
        return 404;
    }

    location /internal/keycloak/ {
        allow 172.21.0.0/16;
        deny  all;

        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/planelyx-proxy.conf;
    }

    location /ocr/ {
        proxy_pass http://127.0.0.1:8084;
        include /etc/nginx/snippets/planelyx-proxy.conf;

        client_max_body_size 25m;

        proxy_read_timeout 120s;
    }

    location /actuator {
        return 404;
    }

    location /v3/api-docs {
        return 404;
    }

    location /swagger-ui {
        return 404;
    }
}
