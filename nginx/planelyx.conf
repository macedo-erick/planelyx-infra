# Host nginx site for planelyx.com.br.
# Install to /etc/nginx/sites-available/planelyx and symlink into sites-enabled.
#
# Bootstrap order: put the :80 server in place first, run
#   certbot --nginx -d planelyx.com.br -d www.planelyx.com.br
# and only then enable the :443 servers below.

server {
    listen 80;
    listen [::]:80;
    server_name planelyx.com.br www.planelyx.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://planelyx.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.planelyx.com.br;

    ssl_certificate     /etc/letsencrypt/live/planelyx.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planelyx.com.br/privkey.pem;

    return 301 https://planelyx.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name planelyx.com.br;

    ssl_certificate     /etc/letsencrypt/live/planelyx.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/planelyx.com.br/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 10m;

    location = / {
        return 302 /ui/;
    }

    # NOTE: every proxy_pass below is bare — no trailing slash, no URI part — so the full
    # request path reaches the backend untouched. Each service is configured to own its
    # own prefix (Angular via --base-href /ui/, Keycloak via KC_HTTP_RELATIVE_PATH=/auth,
    # the API via its /api/* controller mappings), so nothing needs rewriting. Adding a
    # trailing slash to any of these silently breaks it.

    location /ui/ {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/planelyx-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082;
        include /etc/nginx/snippets/planelyx-proxy.conf;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8083;
        include /etc/nginx/snippets/planelyx-proxy.conf;

        # Keycloak emits large headers during the authorization-code flow; the defaults
        # are not big enough and produce upstream 502s.
        proxy_buffer_size       128k;
        proxy_buffers         4 256k;
        proxy_busy_buffers_size 256k;
    }

    # The app permits /actuator/health so the container probe works. Keep it off the
    # internet.
    location /actuator {
        return 404;
    }

    # Swagger is permitAll in SecurityConfig. Delete these two blocks if you decide the
    # API docs should be public.
    location /v3/api-docs {
        return 404;
    }

    location /swagger-ui {
        return 404;
    }
}
